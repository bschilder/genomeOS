[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "genomeos"
version = "0.1.0"
description = "Provenance-first atlas of human genetic variation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.120",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
tabix = ["pysam>=0.23,<1"]
read = ["duckdb>=1.1"]
# Atlas data foundation (P0/P1). Kept out of the default install so the Pan-UKB
# API container does not carry pyarrow/duckdb, which it never uses.
atlas = [
  "pandera[pandas]>=0.23,<1",
  "pandas>=2.2",
  "pyarrow>=17",
  "duckdb>=1.1",
  "h3>=4.1",
]
# Surface inference (P2). Separate from [atlas] because PyMC/PyTensor is a large
# dependency that only the offline fitting jobs need -- never the serving path (§5).
surfaces = [
  "pymc>=5.16",
  "arviz>=0.18",
  # JAX-compiled NUTS. Not optional in practice: the spherical HSGP is ~80x faster through it
  # than through PyTensor, and it is the same code path that runs on a GPU.
  "numpyro>=0.15",
]
# Raster handling for the population denominators (P3, §9). Offline batch only.
geo = [
  "rasterio>=1.3",
]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "ruff>=0.6"]

[project.scripts]
genomeos = "genomeos.cli:main"

[tool.setuptools.packages.find]
include = ["genomeos*"]

[tool.setuptools.package-data]
genomeos = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query() in argument defaults is the canonical FastAPI idiom, not a mutable default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
