name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev,atlas,surfaces,geo]'
      - name: Lint
        run: ruff check .
      - name: Contract not drifted
        run: python scripts/freeze_contract.py --check
      - name: Test
        run: pytest -v
