name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev,atlas,surfaces]'
      - name: Lint
        run: ruff check .
      - name: Contract not drifted
        run: python scripts/freeze_contract.py --check
      - name: Module size
        run: python scripts/check_module_size.py
      - name: Private-file gate
        run: python scripts/check_private_files.py
      - name: Smoke
        run: python scripts/smoke.py
      - name: Test
        run: pytest -v
