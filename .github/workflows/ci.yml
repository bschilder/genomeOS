name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev,atlas,surfaces,geo,figures]'
      - name: Lint
        run: ruff check .
      - name: Contract not drifted
        run: python scripts/freeze_contract.py --check
      - name: Module size
        run: python scripts/check_module_size.py
      - name: Private-file gate
        run: python scripts/check_private_files.py
      - name: Commercial-use marking
        run: python scripts/check_commercial_use.py
      - name: Smoke
        run: python scripts/smoke.py
      - name: Test
        env:
          COVERAGE_CORE: sysmon
        run: pytest -v --cov=genomeos --cov-report=term-missing --cov-report=json
      - name: Coverage badge is current
        run: |
          python scripts/render_coverage_badge.py --readme README.md
          if [[ -n "$(git status --porcelain -- README.md website/public/_static/coverage.svg)" ]]; then
            echo "Coverage changed; regenerate its README badge with scripts/render_coverage_badge.py."
            git diff -- README.md website/public/_static/coverage.svg
            git status --short -- README.md website/public/_static/coverage.svg
            exit 1
          fi
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
      - name: Container HTTP smoke
        run: |
          set -euo pipefail
          docker build -t genomeos-smoke .
          CONTAINER=$(docker run -d --read-only --tmpfs /tmp \
            -e DATABASE_URL=sqlite:////tmp/genomeos.db \
            -e ATLAS_ARTIFACT_ROOT=/artifacts \
            -v "$PWD/demo/artifacts:/artifacts:ro" \
            -p 8080:8080 genomeos-smoke)
          trap 'docker logs "$CONTAINER"; docker rm -f "$CONTAINER"' EXIT
          python scripts/http_smoke.py
